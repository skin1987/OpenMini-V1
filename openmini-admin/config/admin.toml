[server]
host = "0.0.0.0"
port = 9000

[database]
url = "sqlite:data/admin.db?mode=rwc"

[jwt]
# JWT密钥 - 从环境变量读取，生产环境必须更改！
# 设置方式: export OPENMINI_JWT_SECRET="your-secure-random-secret-here"
secret = "${OPENMINI_JWT_SECRET}"
expiration_hours = 24

[upstream]
base_url = "http://localhost:8080/api/v1"
timeout_secs = 10
